<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casa Dams — Orden de Pedido</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --dark: #1C1A17;
    --brown: #6B4F35;
    --gold: #C49A3C;
    --gold-light: #E8C96A;
    --warm-gray: #9E9488;
    --border: #D4C9B8;
    --white: #FDFCF9;
    --red: #C0392B;
    --green: #27634A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* HEADER */
  .header {
    background: var(--dark);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn-menu {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(196,154,60,0.12);
    border: 1px solid rgba(196,154,60,0.3);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-menu:hover { background: rgba(196,154,60,0.22); }

  .header-brand {
    display: flex;
    flex-direction: column;
  }

  .header-brand .logo {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .header-brand .tagline {
    font-size: 11px;
    color: var(--warm-gray);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-orden {
    text-align: right;
  }

  .orden-label {
    font-size: 10px;
    color: var(--warm-gray);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .orden-numero {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--gold);
    font-weight: 700;
    line-height: 1;
  }

  /* MAIN */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* SECTION CARDS */
  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--brown);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
    display: inline-block;
  }

  /* FORM FIELDS */
  .form-row {
    display: grid;
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.cols-1 { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    color: var(--warm-gray);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  input, select {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--dark);
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(196,154,60,0.15);
    background: var(--white);
  }

  input::placeholder { color: #BDB5A8; }

  /* TABLA DE PRODUCTOS */
  .productos-header {
    display: grid;
    grid-template-columns: 70px 1fr 110px 120px 120px 44px;
    gap: 8px;
    padding: 10px 12px;
    background: var(--dark);
    border-radius: 10px 10px 0 0;
    margin-bottom: 0;
  }

  .productos-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .productos-body {
    border: 1.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
  }

  .producto-row {
    display: grid;
    grid-template-columns: 70px 1fr 110px 120px 120px 44px;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }

  .producto-row:last-child { border-bottom: none; }
  .producto-row:hover { background: var(--cream); }

  .producto-row input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px 8px;
    font-size: 15px;
  }

  .producto-row input:focus {
    background: var(--white);
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(196,154,60,0.15);
  }

  .subtotal-display {
    font-weight: 600;
    color: var(--brown);
    font-size: 15px;
    padding: 10px 8px;
    text-align: right;
  }

  .btn-delete-row {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: #FEE2E2;
    color: var(--red);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .btn-delete-row:hover { background: #FECACA; }

  .btn-add-row {
    margin-top: 12px;
    background: transparent;
    border: 1.5px dashed var(--gold);
    color: var(--brown);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-add-row:hover {
    background: rgba(196,154,60,0.08);
    border-color: var(--brown);
  }

  /* TOTALES */
  .totales {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .total-row {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 300px;
  }

  .total-label {
    font-size: 12px;
    color: var(--warm-gray);
    letter-spacing: 1px;
    text-transform: uppercase;
    flex: 1;
    text-align: right;
  }

  .total-value {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--dark);
    min-width: 140px;
    text-align: right;
  }

  .total-row.grand {
    border-top: 2px solid var(--gold);
    padding-top: 10px;
    margin-top: 4px;
  }

  .total-row.grand .total-label { color: var(--brown); font-weight: 600; }
  .total-row.grand .total-value { color: var(--green); font-size: 22px; }

  .total-input {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--dark);
    width: 160px;
    text-align: right;
  }

  .total-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  /* SON */
  .son-field {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--warm-gray);
    font-style: italic;
    min-height: 48px;
  }

  /* CLÁUSULAS */
  .clausulas {
    background: #F0EDE6;
    border-radius: 10px;
    padding: 16px;
    font-size: 11.5px;
    color: var(--warm-gray);
    line-height: 1.6;
  }

  .clausulas p { margin-bottom: 6px; }
  .clausulas strong { color: var(--brown); }

  /* FIRMA */
  .firma-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 8px;
  }

  .firma-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .firma-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--warm-gray);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  canvas.firma-pad {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--cream);
    width: 100%;
    height: 160px;
    cursor: crosshair;
    touch-action: none;
  }

  canvas.firma-pad.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(196,154,60,0.15);
  }

  .firma-actions {
    display: flex;
    gap: 8px;
  }

  .btn-clear-firma {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear-firma:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* FOOTER ACTIONS */
  .footer-actions {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--dark);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
    z-index: 200;
  }

  .btn-primary {
    flex: 1;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 12px;
    padding: 18px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: 0.5px;
  }

  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--warm-gray);
    border: 1.5px solid #3A3730;
    border-radius: 12px;
    padding: 18px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .btn-secondary:hover { border-color: var(--warm-gray); color: var(--white); }

  .btn-whatsapp {
    background: #25D366;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 18px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }

  .btn-whatsapp:hover { background: #20BA5A; transform: translateY(-1px); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    padding: 20px;
  }

  .modal-overlay.show { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--white);
    border-radius: 20px;
    padding: 32px;
    max-width: 440px;
    width: 100%;
    transform: scale(0.95) translateY(20px);
    transition: transform 0.25s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal-overlay.show .modal { transform: scale(1) translateY(0); }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .modal p { color: var(--warm-gray); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

  .modal-input {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    width: 100%;
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 2px;
  }

  .modal-input:focus {
    outline: none;
    border-color: #25D366;
    box-shadow: 0 0 0 3px rgba(37,211,102,0.15);
  }

  .modal-actions { display: flex; gap: 10px; }

  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .modal-btn.cancel { background: var(--cream); color: var(--warm-gray); }
  .modal-btn.confirm { background: #25D366; color: white; }
  .modal-btn.confirm:hover { background: #20BA5A; }

  /* Toast */
  .toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--dark);
    color: var(--gold);
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .aceptada-badge {
    display: inline-block;
    border: 3px solid var(--green);
    color: var(--green);
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 6px;
    letter-spacing: 3px;
    transform: rotate(-5deg);
    opacity: 0.7;
  }

  @media (max-width: 600px) {
    .productos-header { grid-template-columns: 50px 1fr 80px 90px 90px 32px; font-size:10px; }
    .producto-row { grid-template-columns: 50px 1fr 80px 90px 90px 32px; }
    .firma-container { grid-template-columns: 1fr; }
    .header { padding: 14px 16px; }
    .header-brand .logo { font-size: 20px; }
    .orden-numero { font-size: 22px; }
    .btn-menu span { display: none; }
  }

  /* PESTAÑAS */
  .tabs { display: flex; background: var(--dark); padding: 0 24px; gap: 4px; border-top: 1px solid rgba(255,255,255,0.08); }
  .tab-btn { padding: 12px 24px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border: none; background: transparent; color: var(--warm-gray); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* HISTORIAL */
  .historial-search { background: var(--white); border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; border: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  .historial-search input { flex: 1; background: var(--cream); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--dark); }
  .historial-search input:focus { outline: none; border-color: var(--gold); }
  .btn-buscar { background: var(--gold); color: var(--dark); border: none; border-radius: 10px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-refresh { background: transparent; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 18px; cursor: pointer; color: var(--warm-gray); transition: all 0.2s; }
  .fBtn { padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--warm-gray);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s; }
  .fBtn:hover { border-color:var(--gold);color:var(--gold); }
  .fBtn-active { background:var(--gold)!important;border-color:var(--gold)!important;color:var(--dark)!important;font-weight:700!important; }
  .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
  .orden-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.2s; }
  .orden-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(196,154,60,0.12); }
  .orden-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--cream); border-bottom: 1px solid var(--border); }
  .orden-card-num { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--gold); }
  .orden-card-fecha { font-size: 12px; color: var(--warm-gray); }
  .orden-card-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .badge-enviado { background: #D1FAE5; color: #065F46; }
  .badge-noenv { background: #FEE2E2; color: #991B1B; }
  .orden-card-body { padding: 14px 18px; }
  .orden-card-cliente { font-size: 16px; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
  .orden-card-info { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--warm-gray); }
  .orden-card-totales { display: flex; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .tot-item { display: flex; flex-direction: column; gap: 2px; }
  .tot-item .tot-label { font-size: 10px; color: var(--warm-gray); letter-spacing: 1px; text-transform: uppercase; }
  .tot-item .tot-val { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--dark); }
  .tot-item .tot-val.saldo { color: var(--red); }
  .tot-item .tot-val.pagado { color: var(--green); }
  .detalle-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: flex-end; justify-content: center; }
  .detalle-overlay.show { display: flex; }
  .detalle-modal { background: var(--white); border-radius: 24px 24px 0 0; width: 100%; max-width: 900px; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .detalle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .detalle-titulo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); font-weight: 700; }
  .btn-cerrar-detalle { background: var(--cream); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; color: var(--dark); }
  .detalle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .detalle-field { display: flex; flex-direction: column; gap: 4px; }
  .detalle-field .det-label { font-size: 10px; font-weight: 600; color: var(--warm-gray); letter-spacing: 1px; text-transform: uppercase; }
  .detalle-field .det-val { font-size: 15px; color: var(--dark); font-weight: 500; }
  .detalle-productos { background: var(--cream); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .det-prod-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--dark); }
  .det-prod-row:last-child { border-bottom: none; }
  .det-prod-desc { flex: 1; }
  .det-prod-val { font-weight: 600; color: var(--brown); }
  .historial-empty { text-align: center; padding: 60px 20px; color: var(--warm-gray); }
  .historial-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .historial-empty p { font-size: 15px; }
  /* MODAL EDITAR ORDEN */
  .edit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 600;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  .edit-overlay.show { display: flex; }
  .edit-modal {
    background: var(--white);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
  }
  .edit-modal .card-title { font-size: 14px; }
  .edit-prod-row {
    display: grid;
    grid-template-columns: 60px 1fr 90px 110px 110px 36px;

<script>
// ========================
// ESTADO
// ========================
let filas = [];
let firmaData = { comprador: null, vendedor: null };

// ========================
// SUPABASE / WAHA
// ========================
const SUPABASE_URL = 'https://pqpzhmopnigxyacwdjbc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcHpobW9wbmlneHlhY3dkamJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NTc1NzUsImV4cCI6MjA5MjIzMzU3NX0.HDy-WoX5ldwnTsfXHecnJwJ72v2jgaPrXwCSjBrmsys';
const WAHA_SESSION = 'default';

// ========================
// INIT
// ========================
function formatNumOrden(n) {
  return 'ORD/' + String(n).padStart(3, '0');
}

let numeroOrdenActual = 1; // valor numérico actual (para incrementar al guardar)

window.onload = async () => {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('fechaFactura').value = hoy;

  // Leer consecutivo desde Supabase (tabla consecutivos, clave 'orden')
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/consecutivos?clave=eq.orden&select=valor`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0 && data[0].valor) {
      numeroOrdenActual = data[0].valor + 1;
    } else {
      // Fila no existe aún — fallback: buscar el último número en pedidos
      const r2 = await fetch(`${SUPABASE_URL}/rest/v1/pedidos?select=numero_orden&order=created_at.desc&limit=50`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      const pedidos = await r2.json();
      let maxNum = 0;
      if (Array.isArray(pedidos)) {
        pedidos.forEach(p => {
          const raw = String(p.numero_orden || '').replace(/[^0-9]/g, '');
          const n = parseInt(raw);
          if (!isNaN(n) && n > maxNum) maxNum = n;
        });
      }
      numeroOrdenActual = maxNum > 0 ? maxNum + 1 : 1;
    }
  } catch(e) {
    numeroOrdenActual = 1;
  }

  const formatted = formatNumOrden(numeroOrdenActual);
  document.getElementById('numeroOrden').value = formatted;
  document.getElementById('displayNumero').textContent = formatted;

  agregarFila(); agregarFila(); agregarFila();
  initFirma('firmaComprador');
  initFirma('firmaVendedor');
};

// ========================
// PRODUCTOS
// ========================
let filaCounter = 1;
function agregarFila() {
  const id = filaCounter++;
  filas.push(id);
  const body = document.getElementById('productosBody');
  const row = document.createElement('div');
  row.className = 'producto-row';
  row.id = 'fila-' + id;
  row.innerHTML = `
    <input type="number" placeholder="1" min="1" oninput="calcularSubtotal(${id})" onblur="calcularSubtotal(${id})" class="qty-${id}">
    <input type="text" placeholder="Descripción del producto..." class="desc-${id}">
    <input type="text" placeholder="Ref..." class="ref-${id}" style="font-size:13px;">
    <input type="text" placeholder="$0" oninput="calcularSubtotal(${id})" onblur="formatearPrecio(${id})" class="price-${id}" style="text-align:right">
    <div class="subtotal-display" id="sub-${id}">$0</div>
    <button class="btn-delete-row" onclick="eliminarFila(${id})">✕</button>
  `;
  body.appendChild(row);
}

function eliminarFila(id) {
  const row = document.getElementById('fila-' + id);
  if (row) row.remove();
  filas = filas.filter(f => f !== id);
  calcularTotales();
}

function parseMonto(str) {
  if (!str) return 0;
  let clean = str.replace(/[^0-9.,]/g, '');
  if ((clean.match(/\./g) || []).length > 1) {
    clean = clean.replace(/\./g, '');
  } else if (clean.includes(',')) {
    clean = clean.replace(/\./g, '').replace(',', '.');
  } else {
    clean = clean.replace(/\./g, '');
  }
  return parseFloat(clean) || 0;
}

function formatPesos(num) {
  if (!num) return '$0';
  return '$' + Math.round(num).toLocaleString('es-CO');
}

function formatearPrecio(id) {
  const el = document.querySelector('.price-' + id);
  if (!el) return;
  const val = parseMonto(el.value);
  if (val > 0) el.value = formatPesos(val);
  calcularSubtotal(id);
}

function calcularSubtotal(id) {
  const qty = parseFloat(document.querySelector('.qty-' + id)?.value) || 0;
  const price = parseMonto(document.querySelector('.price-' + id)?.value);
  const sub = qty * price;
  const subEl = document.getElementById('sub-' + id);
  if (subEl) subEl.textContent = formatPesos(sub);
  calcularTotales();
}

function calcularTotales() {
  let total = 0;
  filas.forEach(id => {
    const qty = parseFloat(document.querySelector('.qty-' + id)?.value) || 0;
    const price = parseMonto(document.querySelector('.price-' + id)?.value);
    total += qty * price;
  });
  document.getElementById('totalSubtotal').textContent = formatPesos(total);
  document.getElementById('totalGeneral').textContent = formatPesos(total);
  calcularSaldo();
  actualizarSonLetras(total);
}

// ========================
// ABONO MÚLTIPLE
// ========================
function agregarAbono() {
  const container = document.getElementById('abonosContainer');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;align-items:center;width:100%;';
  div.innerHTML = `
    <select style="flex:1;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--cream);color:var(--dark);" onchange="calcularSaldo()">
      <option value="">Medio de pago</option>
      <option>Efectivo</option>
      <option>Tarjeta</option>
      <option>Transferencia</option>
      <option>Nequi</option>
      <option>Daviplata</option>
    </select>
    <input type="text" placeholder="$0" style="width:110px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;text-align:right;" oninput="formatearAbono(this)" onkeyup="calcularSaldo()" onchange="calcularSaldo()">
    <button type="button" onclick="this.parentElement.remove();calcularSaldo();" style="background:var(--red);color:white;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;">✕</button>
  `;
  container.appendChild(div);
  calcularSaldo();
}

function formatearAbono(input) {
  const raw = input.value.replace(/[^0-9]/g, '');
  if (raw) input.value = '$' + parseInt(raw).toLocaleString('es-CO');
  else input.value = '';
  calcularSaldo();
}

function getTotalAbonos() {
  let total = 0;
  document.querySelectorAll('#abonosContainer input[type=text]').forEach(inp => {
    total += parseMonto(inp.value);
  });
  return total;
}

function getAbonosDetalle() {
  const abonos = [];
  document.querySelectorAll('#abonosContainer > div').forEach(div => {
    const medio = div.querySelector('select') ? div.querySelector('select').value : '';
    const inp = div.querySelector('input');
    const monto = inp ? inp.value : '';
    if (medio && parseMonto(monto) > 0) abonos.push({ medio, monto });
  });
  return abonos;
}

function calcularSaldo() {
  const total = parseMonto(document.getElementById('totalGeneral').textContent);
  const abono = getTotalAbonos();
  const saldo = total - abono;
  const display = document.getElementById('totalAbonoDisplay');
  if (display) display.textContent = '$' + abono.toLocaleString('es-CO');
  document.getElementById('totalSaldo').textContent = formatPesos(saldo >= 0 ? saldo : 0);
}

// ========================
// NÚMERO EN LETRAS
// ========================
function numeroALetras(num) {
  const unidades = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE',
    'DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'];
  const decenas = ['','','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const centenas = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  if (num === 0) return 'CERO';
  if (num === 100) return 'CIEN';
  let resultado = '';
  if (num >= 1000000) { const m = Math.floor(num/1000000); resultado += (m===1?'UN MILLÓN ':numeroALetras(m)+' MILLONES '); num%=1000000; }
  if (num >= 1000) { const m = Math.floor(num/1000); resultado += (m===1?'MIL ':numeroALetras(m)+' MIL '); num%=1000; }
  if (num >= 100) { resultado += centenas[Math.floor(num/100)]+' '; num%=100; }
  if (num >= 20) { resultado += decenas[Math.floor(num/10)]; if(num%10) resultado+=' Y '+unidades[num%10]; resultado+=' '; }
  else if (num > 0) { resultado += unidades[num]+' '; }
  return resultado.trim();
}

function actualizarSonLetras(total) {
  if (!total) { document.getElementById('sonLetras').textContent = '—'; return; }
  const entero = Math.floor(total);
  document.getElementById('sonLetras').textContent = numeroALetras(entero) + ' PESOS M/CTE';
}

function initFirma(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  let drawing = false, lastX = 0, lastY = 0;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
    if (e.touches) return { x:(e.touches[0].clientX-rect.left)*sx, y:(e.touches[0].clientY-rect.top)*sy };
    return { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy };
  }
  function start(e) { e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; canvas.classList.add('active'); }
  function draw(e) { e.preventDefault(); if(!drawing)return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.strokeStyle='#1C1A17'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); lastX=p.x; lastY=p.y; }
  function stop() { drawing=false; canvas.classList.remove('active'); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',draw); canvas.addEventListener('mouseup',stop); canvas.addEventListener('mouseleave',stop);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',draw,{passive:false}); canvas.addEventListener('touchend',stop);
}

function limpiarFirma(canvasId) {
  const canvas = document.getElementById(canvasId);
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

function getFirmaDataURL(canvasId) {
  const canvas = document.getElementById(canvasId);
  const data = canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  const hasContent = data.some(v => v !== 0);
  return hasContent ? canvas.toDataURL('image/png') : null;
}

function getDatos() {
  return {
    numero: document.getElementById('numeroOrden').value || '—',
    fechaFactura: document.getElementById('fechaFactura').value,
    fechaVencimiento: document.getElementById('fechaVencimiento').value,
    formaPago: document.getElementById('formaPago').value,
    vendedor: document.getElementById('vendedor').value,
    nombre: document.getElementById('clienteNombre').value,
    direccion: document.getElementById('clienteDireccion').value,
    ciudad: document.getElementById('clienteCiudad').value,
    cc: document.getElementById('clienteCC').value,
    tel: document.getElementById('clienteTel').value,
    correo: document.getElementById('clienteCorreo').value,
    abono: '$' + getTotalAbonos().toLocaleString('es-CO'),
    abonosDetalle: getAbonosDetalle(),
    total: document.getElementById('totalGeneral').textContent,
    saldo: document.getElementById('totalSaldo').textContent,
    son: document.getElementById('sonLetras').textContent,
  };
}

function getProductos() {
  const productos = [];
  document.querySelectorAll('.producto-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const qty = inputs[0]?.value || '';
    const desc = inputs[1]?.value || '';
    const ref = inputs[2]?.value || '';
    const price = inputs[3]?.value || '';
    const sub = row.querySelector('.subtotal-display')?.textContent || '$0';
    if (qty || desc) productos.push({ qty, desc, ref, price, sub });
  });
  return productos;
}

function formatDate(str) {
  if (!str) return '—';
  const [y,m,d] = str.split('-');
  return `${d}/${m}/${y}`;
}

async function generarPDF() {
  try {
    mostrarToast('⏳ Generando PDF...');
    const doc = await generarPDFBlob();
    doc.save(`OrdenPedido_CasaDams_${getDatos().numero}.pdf`);
    mostrarToast('✅ PDF descargado');
  } catch(e) { console.error(e); mostrarToast('⚠️ Error al generar PDF'); }
}

async function previsualizarPDF() {
  try {
    mostrarToast('⏳ Generando vista previa...');
    const doc = await generarPDFBlob();
    window.open(URL.createObjectURL(doc.output('blob')), '_blank');
  } catch(e) { mostrarToast('⚠️ Error al previsualizar'); }
}

function abrirModalWhatsApp() {
  const tel = document.getElementById('clienteTel').value.replace(/\D/g,'');

    document.getElementById('waNumero').value = num;

function cerrarModal() { document.getElementById('modalWA').classList.remove('show'); }

async function enviarWhatsApp() {
  const numero = document.getElementById('waNumero').value.replace(/\D/g,'');
  if (!numero || numero.length < 10) { mostrarToast('⚠️ Ingresa un número válido'); return; }
  cerrarModal();
  mostrarToast('⏳ Generando PDF...');
  try {
    const datos = getDatos();
    const chatId = numero + '@c.us';
    const doc = await generarPDFBlob();
    const pdfBlob = doc.output('blob');
    const fileName = `OrdenPedido_CasaDams_${datos.numero.replace('/','_')}_${Date.now()}.pdf`;

    mostrarToast('⏳ Subiendo PDF...');
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/ordenes/${fileName}`, {
      method: 'POST',
      headers: { 'Authorization':'Bearer '+SUPABASE_KEY, 'apikey':SUPABASE_KEY, 'Content-Type':'application/pdf' },
      body: pdfBlob
    });
    const pdfLink = uploadRes.ok ? `${SUPABASE_URL}/storage/v1/object/public/ordenes/${fileName}` : '';

    mostrarToast('⏳ Enviando por WhatsApp...');
    const mensaje = `🛋️ *CASA DAMS*\n_Muebles Nacionales e Importados_\n\nHola ${datos.nombre||'cliente'}, aquí está su orden de pedido N° ${datos.numero}:\n\n${pdfLink?`📄 ${pdfLink}`:'(PDF no disponible)'}\n\n✅ Gracias por su compra.\n📍 Cra. 4 N° 49-71 B/Los Laureles 2, Montería\n📞 321 540 0839`;

    const res = await fetch('/api/waha', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ endpoint:'/api/sendText', payload:{ session:WAHA_SESSION, chatId, text:mensaje } })
    });

    if (res.ok) {
      mostrarToast('⏳ Guardando orden...');
      const limpiarNum = v => parseMonto(v || '0');
      const resSupabase = await fetch(`${SUPABASE_URL}/rest/v1/pedidos`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal' },
        body: JSON.stringify({
          numero_orden: datos.numero, op: datos.numero,
          cliente: datos.nombre||'', telefono: datos.tel||'',
          cedula: datos.cc||'', direccion: datos.direccion||'',
          ciudad: datos.ciudad||'', correo: datos.correo||'',
          vendedor: datos.vendedor||'', metodo_pago: datos.formaPago||'',
          fecha_orden: datos.fechaFactura||new Date().toISOString().split('T')[0],
          fecha_vencimiento: datos.fechaVencimiento||null,
          productos: getProductos(),
          subtotal: limpiarNum(datos.total),
          valor_total: limpiarNum(datos.total),
          abono: getTotalAbonos(),
          saldo_pendiente: limpiarNum(datos.saldo),
          pdf_url: pdfLink||'', enviado_whatsapp: true,
          notas: datos.son||''
        })
      });
      if (!resSupabase.ok) {
        const errTxt = await resSupabase.text();
        console.error('Supabase error:', resSupabase.status, errTxt);
        mostrarToast('✅ WA enviado · ⚠️ Error al guardar en historial');
      } else {
        // Incrementar consecutivo en Supabase
        await incrementarConsecutivoOrden();
        mostrarToast(pdfLink ? '✅ Orden enviada con PDF' : '✅ Mensaje enviado');
      }
    } else { throw new Error('WAHA error'); }
  } catch(e) {
    console.error(e);
    mostrarToast('⚠️ Error al enviar. Verifica que WAHA esté activo.');
  }
}

async function incrementarConsecutivoOrden() {
  try {
    // Intentar PATCH (actualizar si existe)
    const resPatch = await fetch(`${SUPABASE_URL}/rest/v1/consecutivos?clave=eq.orden`, {
      method: 'PATCH',
      headers: { 'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal' },
      body: JSON.stringify({ valor: numeroOrdenActual })
    });
    if (!resPatch.ok) {
      // Si no existe, hacer INSERT (upsert manual)
      await fetch(`${SUPABASE_URL}/rest/v1/consecutivos`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'resolution=merge-duplicates' },
        body: JSON.stringify({ clave: 'orden', valor: numeroOrdenActual })
      });
    }
  } catch(e) { console.warn('No se pudo actualizar consecutivo orden:', e); }
}

function limpiarTodo() {
  if (!confirm('¿Crear nueva orden? Se perderán los datos actuales.')) return;
  // Leer consecutivo actualizado desde Supabase
  fetch(`${SUPABASE_URL}/rest/v1/consecutivos?clave=eq.orden&select=valor`, {
    headers: { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
  }).then(r=>r.json()).then(data=>{

let todasLasOrdenes = [];
let filtroEstado = 'todos';

async function cargarHistorial() {
  const lista = document.getElementById('historialLista');
  lista.innerHTML = '<div class="historial-loading">⏳ Cargando órdenes...</div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/pedidos?select=*&order=created_at.desc&limit=200`, {
      headers: { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('Error al cargar');
    const ordenes = await res.json();
    todasLasOrdenes = ordenes;
    filtrarOrdenes();
  } catch(e) {
    lista.innerHTML = '<div class="historial-empty"><div class="empty-icon">⚠️</div><p>No se pudo cargar el historial.</p></div>';
  }
}

function setFiltroEstado(estado) {
  filtroEstado = estado;
  document.querySelectorAll('.fBtn').forEach(b => b.classList.remove('fBtn-active'));
  document.getElementById('fBtn-' + estado).classList.add('fBtn-active');
  filtrarOrdenes();
}

function limpiarFiltrosFecha() {
  document.getElementById('filtroFechaDesde').value = '';
  document.getElementById('filtroFechaHasta').value = '';
  filtrarOrdenes();
}

function filtrarOrdenes() {
  const q = document.getElementById('historialBuscar').value.toLowerCase().trim();
  const desde = document.getElementById('filtroFechaDesde').value;
  const hasta = document.getElementById('filtroFechaHasta').value;

  let resultado = todasLasOrdenes.filter(o => {
    // Texto
    if (q) {
      const match =
        (o.cliente||'').toLowerCase().includes(q) ||
        (o.numero_orden||'').toString().includes(q) ||
        (o.telefono||'').includes(q) ||
        (o.cedula||'').includes(q) ||
        (o.vendedor||'').toLowerCase().includes(q);
      if (!match) return false;
    }
    // Estado de pago
    if (filtroEstado === 'pendiente' && !(o.saldo_pendiente > 0)) return false;
    if (filtroEstado === 'pagado'    &&  (o.saldo_pendiente > 0)) return false;
    // Fechas
    const fechaOrden = (o.fecha_orden || o.created_at || '').substring(0, 10);
    if (desde && fechaOrden < desde) return false;
    if (hasta && fechaOrden > hasta) return false;
    return true;
  });

  // Resumen
  const resumen = document.getElementById('historialResumen');
  if (resumen) {
    const pagadas   = resultado.filter(o => !(o.saldo_pendiente > 0)).length;
    const pendientes = resultado.filter(o => o.saldo_pendiente > 0).length;
    resumen.textContent = resultado.length > 0
      ? `${resultado.length} orden${resultado.length!==1?'es':''} · ✅ ${pagadas} pagada${pagadas!==1?'s':''} · ⏳ ${pendientes} por pagar`
      : '';
  }

  renderOrdenes(resultado);
}

function formatFecha(f) { if(!f)return'—'; return new Date(f).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }

async function generarComprobanteAbono(o, monto, medio, nuevoAbono, nuevoSaldo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:[80, 140] });
  const W = 80, margin = 6;

  // Header oscuro
  doc.setFillColor(28,26,23);
  doc.rect(0, 0, W, 28, 'F');

  // Logo si está disponible
  if (window.LOGO_DATA_URL) {
    doc.addImage(window.LOGO_DATA_URL, 'JPEG', margin, 3, 14, 14);
  }

  doc.setTextColor(196,154,60);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('CASA DAMS', margin + 16, 10);
  doc.setFont('helvetica','normal');
  doc.setFontSize(6);
  doc.setTextColor(158,148,136);
  doc.text('Muebles Nacionales e Importados', margin + 16, 15);
  doc.text('Cra. 4 N° 49-71 B/Los Laureles 2, Montería', margin + 16, 19);
  doc.text('Cel. 321 540 0839', margin + 16, 23);

  // Título comprobante
  doc.setFillColor(196,154,60);
  doc.rect(0, 28, W, 8, 'F');
  doc.setTextColor(28,26,23);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.text('COMPROBANTE DE ABONO', W/2, 33.5, {align:'center'});

  // Fecha y hora
  const ahora = new Date();
  const fechaStr = ahora.toLocaleDateString('es-CO', {day:'2-digit', month:'long', year:'numeric'});
  const horaStr  = ahora.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});

  let y = 42;
  const drawFila = (label, valor, bold=false) => {
    doc.setFont('helvetica','bold');
    doc.setFontSize(6.5);
    doc.setTextColor(107,79,53);
    doc.text(label, margin, y);
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.setFontSize(bold?8:7.5);
    doc.setTextColor(28,26,23);
    doc.text(valor, W - margin, y, {align:'right'});
    doc.setDrawColor(212,201,184);
    doc.setLineWidth(0.2);
    doc.line(margin, y+1.5, W-margin, y+1.5);
    y += 8;
  };

  drawFila('Fecha:', fechaStr);
  drawFila('Hora:', horaStr);
  drawFila('Orden N°:', String(o.numero_orden || o.op || '—'));
  drawFila('Cliente:', o.cliente || '—');

  y += 2;
  doc.setFillColor(245,240,232);
  doc.rect(margin, y-3, W - margin*2, 26, 'F');
  doc.setDrawColor(196,154,60);
  doc.setLineWidth(0.4);
  doc.rect(margin, y-3, W - margin*2, 26);

  const totalOrden = o.valor_total || 0;
  const saldoAnterior = (o.abono || 0);  // abono antes de este pago
  drawFila('Saldo anterior:', formatCOP(Math.max(totalOrden - saldoAnterior, 0)));
  drawFila('Abono:', formatCOP(monto) + ' (' + medio + ')', true);
  const saldoReal = Math.max(nuevoSaldo, 0);
  drawFila('Saldo pendiente:', formatCOP(saldoReal));

  y += 2;
  if (totalOrden > 0 && nuevoSaldo <= 0) {
    doc.setFillColor(209,250,229);
    doc.rect(margin, y, W - margin*2, 10, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(7.5);
    doc.setTextColor(6,95,70);
    doc.text('✅ ORDEN COMPLETAMENTE PAGADA', W/2, y+6.5, {align:'center'});
    y += 14;
  }

  // Pie
  y += 4;
  doc.setFont('helvetica','italic');
  doc.setFontSize(6);
  doc.setTextColor(158,148,136);
  doc.text('Gracias por su pago. Este documento es su', W/2, y, {align:'center'}); y+=4;
  doc.text('soporte de pago oficial — Casa Dams 2025.', W/2, y, {align:'center'});

  return doc;
}

async function registrarAbono(ordenId) {
  const medio = document.getElementById('abonoMedio').value;
  const monto = parseMonto(document.getElementById('abonoMonto').value);
  const status = document.getElementById('abonoStatus');
  if (!medio) { status.textContent='⚠️ Selecciona el medio de pago'; status.style.color='var(--red)'; return; }
  if (monto<=0) { status.textContent='⚠️ Ingresa un monto válido'; status.style.color='var(--red)'; return; }

  const o = todasLasOrdenes.find(x=>x.id===ordenId);
  if (!o) return;
  const nuevoAbono = (o.abono||0) + monto;
  const nuevoSaldo = (o.valor_total||0) - nuevoAbono;

  status.textContent='⏳ Guardando...'; status.style.color='var(--warm-gray)';

  const resUpdate = await fetch(`${SUPABASE_URL}/rest/v1/pedidos?id=eq.${ordenId}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal'},
    body:JSON.stringify({ abono:nuevoAbono, saldo_pendiente:nuevoSaldo>=0?nuevoSaldo:0 })
  });

  if (!resUpdate.ok) { status.textContent='❌ Error al guardar.'; status.style.color='var(--red)'; return; }

  // Generar y subir PDF comprobante
  status.textContent='⏳ Generando comprobante...'; status.style.color='var(--warm-gray)';
  let comprobanteLink = '';
  try {
    const docComp = await generarComprobanteAbono(o, monto, medio, nuevoAbono, nuevoSaldo);
    const compBlob = docComp.output('blob');
    const compFileName = `Abono_${o.numero_orden||o.op}_${Date.now()}.pdf`;
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/ordenes/${compFileName}`, {
      method:'POST',
      headers:{'Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY,'Content-Type':'application/pdf'},
      body: compBlob
    });
    if (uploadRes.ok) comprobanteLink = `${SUPABASE_URL}/storage/v1/object/public/ordenes/${compFileName}`;
  } catch(e) { console.warn('Error generando comprobante:', e); }

  // Enviar WhatsApp
  status.textContent='⏳ Notificando al cliente...'; status.style.color='var(--warm-gray)';
  const telefono = (o.telefono||'').replace(/\D/g,'');
  if (telefono) {
    const chatId = (telefono.startsWith('57')?telefono:'57'+telefono)+'@c.us';
    const totalOrden = o.valor_total || 0;
    const estadoPago = (totalOrden > 0 && nuevoSaldo <= 0)
      ? '🎉 *¡Tu orden está completamente pagada!*'
      : `📋 *Saldo pendiente:* ${formatCOP(Math.max(nuevoSaldo,0))}`;
    const mensaje = `🛋️ *CASA DAMS*
_Muebles Nacionales e Importados_

Hola *${o.cliente||'cliente'}*, se ha registrado un abono a tu orden N° *${o.numero_orden||o.op}*:

async function descargarOrdenPNG(pdfUrl, numeroOrden, cliente) {
  try {
    mostrarToast('⏳ Generando imagen...');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const loadingTask = pdfjsLib.getDocument(pdfUrl);
    const pdf = await loadingTask.promise;
    const totalPages = pdf.numPages;

    // Renderizar cada página
    const canvasList = [];
    for (let i = 1; i <= totalPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 4 }); // zoom mayor = se ve más cerca
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      canvasList.push(canvas);
    }

    // Unir todas las páginas verticalmente en un solo canvas
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = canvasList[0].width;
    finalCanvas.height = canvasList.reduce((sum, c) => sum + c.height, 0);
    const ctx = finalCanvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
    let offsetY = 0;
    canvasList.forEach(c => { ctx.drawImage(c, 0, offsetY); offsetY += c.height; });

    // Descargar
    const nombreLimpio = (cliente || 'cliente').replace(/\s+/g, '-').substring(0, 30);
    const link = document.createElement('a');
    link.download = `OrdenCasaDams-${numeroOrden}-${nombreLimpio}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
    mostrarToast('✅ Imagen descargada');
  } catch(e) {
    console.error(e);
    mostrarToast('⚠️ Error al generar imagen');
  }
}

function editAgregarFila(p) {

  row.className = 'edit-prod-row';
  row.id = 'efila-' + id;
  const qty   = p ? (p.qty||'') : '';
  const desc  = p ? (p.desc||p.descripcion||'') : '';
  const ref   = p ? (p.ref||'') : '';
  const price = p ? (p.price||p.unitario||'') : '';
  row.innerHTML = `
    <input type="number" placeholder="1" min="1" value="${qty}" oninput="editCalcSub(${id})" class="eqty-${id}">

function editEliminarFila(id) {
  const row = document.getElementById('efila-' + id);
  if (row) row.remove();
  editFilas = editFilas.filter(f => f !== id);
  const o = todasLasOrdenes.find(x => x.id === editandoOrdenId);
  editCalcularTotal(o ? (o.abono || 0) : 0);
}

function editFormatPrice(id) {
  const el = document.querySelector('.eprice-' + id);
  if (!el) return;
  const val = parseMonto(el.value);
  if (val > 0) el.value = formatPesos(val);
  editCalcSub(id);
}

function editCalcSub(id, silencioso) {
  const qty = parseFloat(document.querySelector('.eqty-'+id)?.value) || 0;
  const price = parseMonto(document.querySelector('.eprice-'+id)?.value);
  const sub = qty * price;
  const el = document.getElementById('esub-' + id);
  if (el) el.textContent = formatPesos(sub);
  if (!silencioso) {
    const o = todasLasOrdenes.find(x => x.id === editandoOrdenId);
    editCalcularTotal(o ? (o.abono || 0) : 0);
  }
}

function editCalcularTotal(abonoExistente) {
  let total = 0;
  editFilas.forEach(id => {
    const qty = parseFloat(document.querySelector('.eqty-'+id)?.value) || 0;
    const price = parseMonto(document.querySelector('.eprice-'+id)?.value);
    total += qty * price;
  });
  const saldo = Math.max(total - (abonoExistente || 0), 0);
  const tEl = document.getElementById('editTotalDisplay');
  const sEl = document.getElementById('editSaldoDisplay');
  if (tEl) tEl.textContent = formatPesos(total);
  if (sEl) sEl.textContent = formatPesos(saldo);
}

function getEditProductos() {
  const productos = [];
  editFilas.forEach(id => {
    const qty   = document.querySelector('.eqty-'+id)?.value || '';
    const desc  = document.querySelector('.edesc-'+id)?.value || '';
    const ref   = document.querySelector('.eref-'+id)?.value || '';
    const price = document.querySelector('.eprice-'+id)?.value || '';
    const sub   = document.getElementById('esub-'+id)?.textContent || '$0';
    if (qty || desc) productos.push({ qty, desc, ref, price, sub });
  });
  return productos;
}

function getEditDatos() {
  return {
    cliente:     document.getElementById('eCliente')?.value || '',
    telefono:    document.getElementById('eTel')?.value || '',
    cedula:      document.getElementById('eCC')?.value || '',

async function guardarEdicion(silencioso) {
  const status = document.getElementById('editStatus');
  if (status) { status.textContent = '⏳ Guardando...'; status.style.color = 'var(--warm-gray)'; }
  const datos = getEditDatos();
  const productos = getEditProductos();
  const o = todasLasOrdenes.find(x => x.id === editandoOrdenId);
  if (!o) return;

  const totalNum = productos.reduce((acc, p) => {
    const qty = parseFloat(p.qty) || 0;
    const price = parseMonto(p.price);
    return acc + qty * price;
  }, 0);
  const abonoActual = o.abono || 0;
  const nuevoSaldo = Math.max(totalNum - abonoActual, 0);

  const res = await fetch(`${SUPABASE_URL}/rest/v1/pedidos?id=eq.${editandoOrdenId}`, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal' },
    body: JSON.stringify({
      cliente:       datos.cliente,
      telefono:      datos.telefono,
      cedula:        datos.cedula,
      ciudad:        datos.ciudad,
      direccion:     datos.direccion,
      metodo_pago:   datos.metodo_pago,
      vendedor:      datos.vendedor,
      productos:     productos,
      valor_total:   totalNum,
      saldo_pendiente: nuevoSaldo,
    })
  });

  // Actualizar objeto local
  Object.assign(o, { ...datos, productos, valor_total: totalNum, saldo_pendiente: nuevoSaldo });

  if (!res.ok) {
    if (status) { status.textContent = '❌ Error al guardar'; status.style.color = 'var(--red)'; }
    return false;
  }
  if (!silencioso) {
    if (status) { status.textContent = '✅ Cambios guardados'; status.style.color = 'var(--green)'; }
    mostrarToast('✅ Orden actualizada');
    setTimeout(() => { cerrarEditar(); cargarHistorial(); }, 1500);
  }
  return true;
}

      {label:'',value:'',bg:[245,242,235]},
      {label:'SALDO $',value:formatPesos(saldoN),bg:[240,237,230]},
      {label:'TOTAL $',value:formatPesos(totalFinal),bg:[28,26,23]},
    ];
    totalesArr.forEach((t,i)=>{
      doc.setFillColor(...t.bg);doc.rect(totX,y+i*10,totW,10,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.setTextColor(i===3?196:107,i===3?154:79,i===3?60:53);
      doc.text(t.label,totX+4,y+i*10+6.5);
      doc.setTextColor(i===3?196:28,i===3?154:26,i===3?60:23);
      doc.text(t.value,totX+totW-4,y+i*10+6.5,{align:'right'});
      doc.setDrawColor(212,201,184);doc.setLineWidth(0.3);doc.rect(totX,y+i*10,totW,10);
    });
    y+=44;

    // Cláusulas
    const clausulaTextE=[
      '1. El sistema de pago donde el comprador se compromete a dejar separado un artículo de la empresa CASA DAMS con un valor mínimo inicial del 20% del valor total y durante el plazo pactado ir cancelando por abonos el 80% restante de la negociación; al llegado el caso se cumpla el tiempo y no ha terminado de cancelar asumirá sobre el saldo el incremento del 10% por incumplimiento.',
      '2. CASA DAMS se compromete que durante el tiempo estipulado en la factura sostendrá el precio del artículo relacionado en ella al terminar de cancelar todo el valor en los días hábiles siguientes entregar el artículo al cliente.',
      '3. En ningún momento el comprador podrá exigir la devolución del dinero abonado a esta factura. Si llegado el motivo no requiere llevar el artículo o se ha vencido el plazo estipulado y no ha cancelado en su totalidad, el cliente asumirá el 5% del valor total de la factura y el restante del dinero abonado lo llevará en algún artículo del almacén, más no en dinero en efectivo.'
    ];
    let totalLinesE=0;
    clausulaTextE.forEach(c=>{ totalLinesE+=doc.splitTextToSize(c,contentW-6).length+0.5; });
    const clausulaHE=8+totalLinesE*3.2;
    doc.setFillColor(245,240,232);doc.rect(margin,y,contentW,clausulaHE,'F');
    doc.setDrawColor(212,201,184);doc.setLineWidth(0.3);doc.rect(margin,y,contentW,clausulaHE);
    doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(107,79,53);
    doc.text('CLÁUSULAS DE PAGO',margin+contentW/2,y+4,{align:'center'});
    let tyE=y+8;
    clausulaTextE.forEach(c=>{
      const lines=doc.splitTextToSize(c,contentW-6);
      doc.setFont('helvetica','normal');doc.setFontSize(5.8);doc.setTextColor(80,70,60);
      doc.text(lines,margin+3,tyE); tyE+=lines.length*3.2+1;
    });
    y+=clausulaHE+4;

    // Firmas (vacías en edición)
    const pageHF=doc.internal.pageSize.getHeight();
    if(y+42>pageHF-10){doc.addPage();y=15;}
    const firmaHE=38,firmaWE=contentW/2-5;
    doc.setFillColor(240,237,230);doc.rect(margin,y,firmaWE,firmaHE,'F');
    doc.setDrawColor(212,201,184);doc.setLineWidth(0.3);doc.rect(margin,y,firmaWE,firmaHE);
    doc.setDrawColor(39,99,74);doc.setLineWidth(1.2);doc.rect(margin+2,y+2,30,10,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(39,99,74);
    doc.text('ACEPTADA',margin+17,y+9,{align:'center'});
    doc.setDrawColor(180,170,160);doc.setLineWidth(0.3);doc.line(margin+4,y+firmaHE-6,margin+firmaWE-4,y+firmaHE-6);
    doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(107,79,53);
    doc.text('FIRMA Y C.C. DEL COMPRADOR',margin+firmaWE/2,y+firmaHE-2,{align:'center'});
    const firmaVXE=margin+firmaWE+10;
    doc.setFillColor(240,237,230);doc.rect(firmaVXE,y,firmaWE,firmaHE,'F');
    doc.setDrawColor(212,201,184);doc.setLineWidth(0.3);doc.rect(firmaVXE,y,firmaWE,firmaHE);
    doc.setDrawColor(180,170,160);doc.setLineWidth(0.3);doc.line(firmaVXE+4,y+firmaHE-6,firmaVXE+firmaWE-4,y+firmaHE-6);
    doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(107,79,53);
    doc.text('FIRMA DEL VENDEDOR',firmaVXE+firmaWE/2,y+firmaHE-2,{align:'center'});

    // Subir PDF
    if(status){status.textContent='⏳ Subiendo PDF...';}
    const pdfBlob=doc.output('blob');
    const fileName=`OrdenPedido_CasaDams_${numOrden}_edit_${Date.now()}.pdf`;
    const uploadRes=await fetch(`${SUPABASE_URL}/storage/v1/object/ordenes/${fileName}`,{
      method:'POST',headers:{'Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY,'Content-Type':'application/pdf'},body:pdfBlob
    });
    const pdfLink=uploadRes.ok?`${SUPABASE_URL}/storage/v1/object/public/ordenes/${fileName}`:'';

    // Actualizar pdf_url en Supabase
    if(pdfLink){
      await fetch(`${SUPABASE_URL}/rest/v1/pedidos?id=eq.${editandoOrdenId}`,{
        method:'PATCH',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=minimal'},
        body:JSON.stringify({pdf_url:pdfLink,enviado_whatsapp:true})
      });
      o.pdf_url=pdfLink; o.enviado_whatsapp=true;
    }

    // Enviar WhatsApp
    if(status){status.textContent='⏳ Enviando por WhatsApp...';}
    const telefono=(datosEdit.telefono||'').replace(/\D/g,'');
    if(telefono){
      const chatId=(telefono.startsWith('57')?telefono:'57'+telefono)+'@c.us';
      const mensaje=`🛋️ *CASA DAMS*\n_Muebles Nacionales e Importados_\n\nHola *${datosEdit.cliente||'cliente'}*, se ha actualizado su orden de pedido N° *${numOrden}*:\n\n${pdfLink?`📄 ${pdfLink}`:'(PDF no disponible)'}\n\n✅ Gracias por su preferencia.\n📍 Cra. 4 N° 49-71 B/Los Laureles 2, Montería\n📞 321 540 0839`;
      await fetch('/api/waha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:'/api/sendText',payload:{session:WAHA_SESSION,chatId,text:mensaje}})});
    }

    if(status){status.textContent='✅ Orden actualizada y enviada por WhatsApp';status.style.color='var(--green)';}
    mostrarToast('✅ Orden reenviada exitosamente');
    setTimeout(()=>{ cerrarEditar(); cargarHistorial(); },2000);
  } catch(e) {
    console.error(e);
    if(status){status.textContent='⚠️ Error al generar/enviar PDF';status.style.color='var(--red)';}
  }
}

function cerrarEditar() {
  document.getElementById('editOverlay').classList.remove('show');
  editandoOrdenId = null;
  editFilas = [];
}

document.getElementById('editOverlay').addEventListener('click', function(e){ if(e.target===this)cerrarEditar(); });
</script>
</body>
</html>
